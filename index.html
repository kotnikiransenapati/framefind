
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelVerse | Image Search</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>PixelVerse</h1>
    <p>Discover your world, one image at a time.</p>
  </header>

  <main>
    <form id="search-form">
      <input
        type="text"
        id="search-input"
        placeholder="Search for cats, ocean, new york..."
        aria-label="Search images"
      >
      <button id="search-button" type="submit">Search</button>
    </form>

    <p id="results-count"></p>
    <div id="results"></div>
  </main>
</body>
</html>
